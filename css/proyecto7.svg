<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Pantallas de KidFit: inicio con actividad del día e hidratación, y sesión con detección de movimiento por cámara">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1d1640"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6C4CF5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6C4CF5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2346"/>
      <stop offset="1" stop-color="#16122a"/>
    </linearGradient>
    <clipPath id="s1"><rect x="214" y="44" width="176" height="362" rx="22"/></clipPath>
    <clipPath id="s2"><rect x="424" y="44" width="176" height="362" rx="22"/></clipPath>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="225" r="300" fill="url(#glow)"/>

  <!-- Teléfono 1: inicio -->
  <rect x="206" y="36" width="192" height="378" rx="30" fill="#0e0b1d" stroke="#3a3260" stroke-width="2"/>
  <g clip-path="url(#s1)">
    <rect x="214" y="44" width="176" height="362" fill="#FFF6EC"/>
    <rect x="276" y="52" width="52" height="8" rx="4" fill="#0e0b1d"/>
    <!-- saludo -->
    <circle cx="242" cy="90" r="16" fill="#FFC233"/>
    <circle cx="237" cy="87" r="2" fill="#2B2346"/><circle cx="247" cy="87" r="2" fill="#2B2346"/>
    <path d="M236 94 q6 6 12 0" fill="none" stroke="#2B2346" stroke-width="2" stroke-linecap="round"/>
    <text x="266" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#6B6485">Racha de 5 días</text>
    <text x="266" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#2B2346">¡Hola, Sofi!</text>
    <!-- actividad del día -->
    <rect x="226" y="120" width="152" height="86" rx="14" fill="#6C4CF5"/>
    <text x="238" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#EDE8FF">ACTIVIDAD DEL DÍA</text>
    <text x="238" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Saltos de tijera</text>
    <text x="238" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#EDE8FF">10 repeticiones · cámara</text>
    <rect x="238" y="182" width="62" height="16" rx="8" fill="#FFC233"/>
    <text x="269" y="193.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#2B2346">¡A jugar!</text>
    <g stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".9">
      <circle cx="350" cy="146" r="6" fill="#fff" stroke="none"/>
      <path d="M350 152 v18 M350 158 l-12 -8 M350 158 l12 -8 M350 170 l-9 14 M350 170 l9 14"/>
    </g>
    <!-- hidratación -->
    <rect x="226" y="216" width="152" height="66" rx="14" fill="#fff"/>
    <path d="M246 234 q-8 11 0 17 q8 -6 0 -17z" fill="#4DB8E6"/>
    <text x="260" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2B2346">Hidratación</text>
    <text x="260" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#6B6485">5 de 8 vasos</text>
    <rect x="238" y="262" width="128" height="8" rx="4" fill="#E0F4FC"/>
    <rect x="238" y="262" width="80" height="8" rx="4" fill="#4DB8E6"/>
    <!-- semana -->
    <rect x="226" y="292" width="152" height="70" rx="14" fill="#fff"/>
    <text x="238" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2B2346">Esta semana</text>
    <g fill="#EDE8FF">
      <rect x="240" y="320" width="14" height="30" rx="4"/><rect x="259" y="320" width="14" height="30" rx="4"/><rect x="278" y="320" width="14" height="30" rx="4"/>
      <rect x="297" y="320" width="14" height="30" rx="4"/><rect x="316" y="320" width="14" height="30" rx="4"/><rect x="335" y="320" width="14" height="30" rx="4"/><rect x="354" y="320" width="14" height="30" rx="4"/>
    </g>
    <g fill="#19B5A5">
      <rect x="240" y="332" width="14" height="18" rx="4"/><rect x="259" y="326" width="14" height="24" rx="4"/><rect x="278" y="338" width="14" height="12" rx="4"/>
      <rect x="297" y="324" width="14" height="26" rx="4"/><rect x="316" y="330" width="14" height="20" rx="4" fill="#6C4CF5"/>
    </g>
    <!-- barra de pestañas -->
    <rect x="214" y="374" width="176" height="32" fill="#fff"/>
    <g fill="#A0A7BA"><circle cx="244" cy="390" r="5" fill="#6C4CF5"/><circle cx="283" cy="390" r="5"/><circle cx="322" cy="390" r="5"/><circle cx="361" cy="390" r="5"/></g>
  </g>

  <!-- Teléfono 2: sesión con cámara -->
  <rect x="416" y="36" width="192" height="378" rx="30" fill="#0e0b1d" stroke="#3a3260" stroke-width="2"/>
  <g clip-path="url(#s2)">
    <rect x="424" y="44" width="176" height="362" fill="url(#cam)"/>
    <rect x="486" y="52" width="52" height="8" rx="4" fill="#0e0b1d"/>
    <rect x="436" y="70" width="80" height="18" rx="9" fill="#ffffff22"/>
    <circle cx="447" cy="79" r="3.5" fill="#FF6B4A"/>
    <text x="455" y="82.5" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#fff">Cámara activa</text>
    <!-- esqueleto de MediaPipe -->
    <g stroke="#19B5A5" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M512 150 L512 222"/>
      <path d="M496 162 L528 162"/>
      <path d="M496 162 L472 132 L462 104"/>
      <path d="M528 162 L552 132 L562 104"/>
      <path d="M500 222 L524 222"/>
      <path d="M500 222 L478 262 L466 300"/>
      <path d="M524 222 L546 262 L558 300"/>
    </g>
    <circle cx="512" cy="134" r="14" fill="none" stroke="#19B5A5" stroke-width="3"/>
    <g fill="#FFC233">
      <circle cx="496" cy="162" r="4"/><circle cx="528" cy="162" r="4"/><circle cx="472" cy="132" r="4"/><circle cx="552" cy="132" r="4"/>
      <circle cx="462" cy="104" r="4"/><circle cx="562" cy="104" r="4"/><circle cx="500" cy="222" r="4"/><circle cx="524" cy="222" r="4"/>
      <circle cx="478" cy="262" r="4"/><circle cx="546" cy="262" r="4"/><circle cx="466" cy="300" r="4"/><circle cx="558" cy="300" r="4"/>
    </g>
    <!-- contador -->
    <rect x="436" y="322" width="152" height="68" rx="16" fill="#FFF6EC"/>
    <text x="452" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#6B6485">Repeticiones</text>
    <text x="452" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#6C4CF5">8<tspan font-size="14" fill="#6B6485" font-weight="600"> / 10</tspan></text>
    <g fill="#FFC233"><path d="M546 342 l3 6 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1z"/><path d="M566 342 l3 6 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1z"/></g>
    <path d="M546 368 l3 6 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1z" fill="#ffffff" stroke="#CDD2DE"/>
  </g>
</svg>
